name: CI

on:
  push:
    paths-ignore:
      - '.*/**'
      - LICENSE
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '.*/**'
      - LICENSE
      - '**/*.md'
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          
      - name: Build
        run: dotnet build
        
      - name: Test
        run: dotnet test --nologo --no-build --verbosity normal -- NUnit.NumberOfTestWorkers=3
        
      - name: Report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: Test Results
          path: FryProxy.Tests/TestResults/*.trx
          reporter: dotnet-trx