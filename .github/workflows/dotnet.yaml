name: CI

on:
  push:
    paths-ignore:
      - '.*/**'
      - LICENSE
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '.*/**'
      - LICENSE
      - '**/*.md'
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          
      - name: Build
        run: dotnet build
        
      - name: Test
        run: dotnet test --nologo --no-build --verbosity normal -- NUnit.NumberOfTestWorkers=3

      - name: h2spec
        continue-on-error: true
        run: dotnet test --nologo --no-build --filter "Category=h2spec" --logger "console" -- NUnit.NumberOfTestWorkers=2

      - name: Report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: Test Results
          path: FryProxy.Tests/TestResults/FryProxy.Tests.trx
          reporter: dotnet-trx

      - name: h2spec Report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: FryProxy.Tests/bin/Debug/net10.0/h2spec/*.xml
          fail_on_failure: false