name: CI

on:
  push:
    paths-ignore:
      - '.*/**'
      - LICENSE
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '.*/**'
      - LICENSE
      - '**/*.md'
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - parallel:
          - name: Build
            run: dotnet build

          - name: Test
            run: dotnet test --nologo --no-build --verbosity normal -- NUnit.NumberOfTestWorkers=3

      - name: Report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: Test Results
          path: FryProxy.Tests/TestResults/FryProxy.Tests.trx
          reporter: dotnet-trx

  h2spec:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
          fetch-depth: 1

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run h2spec
        run: dotnet test --nologo --no-build --filter "Category=h2spec" --logger "console" -- NUnit.NumberOfTestWorkers=2

      - name: h2spec Report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: test-summary/action@v2
        with:
          paths: FryProxy.Tests/bin/Debug/net10.0/h2spec/*.xml